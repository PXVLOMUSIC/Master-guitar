name: Build Android APK/AAB

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci || npm install

      - name: Install Capacitor plugins
        run: npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/app @capacitor/local-notifications

      - name: Prepare web assets
        run: |
          rm -rf www
          mkdir www
          cp index.html www/
          cp -r css js data assets locales backend www/
          rm -rf www/data/_tmp* 2>/dev/null || true

      - name: Add Android platform
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Generate app icons
        run: python scripts/gen-icons.py assets/icon-1024.png

      - name: Patch AndroidManifest
        run: python scripts/patch-android.py android/app/src/main/AndroidManifest.xml

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: strumio-android-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 7

      - name: Build AAB
        run: |
          cd android
          ./gradlew bundleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v5
        with:
          name: strumio-android-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 7