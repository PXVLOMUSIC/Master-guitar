name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Verify tools
        run: |
          which node
          node --version
          npm --version
          npx --version
          java -version 2>&1
          xcodebuild -version

      - name: Install dependencies
        run: npm ci || npm install

      - name: Prepare web assets
        run: |
          rm -rf www
          mkdir -p www
          cp index.html www/
          cp -r css js data assets locales backend www/
          rm -f www/data/_tmp* 2>/dev/null || true

      - name: Add iOS platform
        run: |
          export PATH="$(npm config get prefix)/bin:$PATH"
          if [ ! -d "ios" ]; then npx cap add ios; fi
          npx cap sync ios

      - name: Build IPA (unsigned)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tail -40
          cd build/Products/Release-iphoneos
          mkdir -p Payload
          cp -r App.app Payload/
          zip -r ../../../App.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: strumio-ios-ipa
          path: ios/App/build/App.ipa
          retention-days: 7