name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Verify tools
        run: |
          echo "Node: $(node --version)"
          echo "NPM: $(npm --version)"
          java -version 2>&1
          xcodebuild -version

      - name: Install dependencies
        run: npm install @capacitor/core @capacitor/cli @capacitor/ios @capacitor/app

      - name: Prepare web assets
        run: |
          rm -rf www
          mkdir -p www
          cp index.html www/
          cp -r css js data assets locales backend www/
          rm -f www/data/_tmp* 2>/dev/null || true

      - name: Add iOS platform
        run: |
          if [ ! -d "ios" ]; then
            node ./node_modules/.bin/cap add ios
          fi
          node ./node_modules/.bin/cap sync ios

      - name: Patch iOS Info.plist
        run: |
          PLIST=$(find ios -name "Info.plist" | head -1)
          echo "Patching $PLIST"
          python3 scripts/patch-ios.py "$PLIST"

      - name: Build IPA (unsigned)
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
          APP_PATH=$(find build -name "App.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "Build failed - no App.app found"
            exit 1
          fi
          cd "$(dirname "$APP_PATH")"
          rm -rf Payload
          mkdir -p Payload
          cp -r App.app Payload/
          zip -r App.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v5
        with:
          name: strumio-ios-ipa
          path: ios/App/build/**/App.ipa
          retention-days: 7