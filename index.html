<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strumio — Aprende guitarra</title>
<meta name="description" content="Aprende guitarra paso a paso con lecciones, afinador, acordes y práctica diaria. También ukelele y bajo.">
<meta name="theme-color" content="#131f24">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="assets/icons/favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Strumio">
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="has-bg-image">
<a href="#view" class="skip-link">Saltar al contenido</a>
<div class="app" id="app">
  <div class="topbar" id="topbar" style="display:none">
    <div class="stat streak"><span>🔥</span><span id="streak">0</span></div>
    <div class="xpbar"><div id="xpfill" style="width:0%"></div></div>
    <div class="stat gem"><span>💎</span><span id="gems">0</span></div>
    <button id="globalSearchBtn" class="gs-topbar-btn" title="Buscar (Ctrl+K)">🔍</button>
    <div class="stat heart"><span>❤️</span><span id="hearts">5</span></div>
  </div>
  <div id="view" role="main" aria-live="polite"></div>
</div>
<nav class="bottomnav" id="bottomnav" style="display:none" role="navigation" aria-label="Navegación principal">
  <button data-route="home" class="active" data-i18n="nav.home" aria-label="Inicio">🏠 Inicio</button>
  <button data-route="learn" data-i18n="nav.learn" aria-label="Aprender">📚 Aprender</button>
  <button data-route="tuner" data-i18n="nav.tuner" aria-label="Afinador">🎯 Afinador</button>
  <button data-route="practice" data-i18n="nav.practice" aria-label="Practicar">🎸 Practicar</button>
  <button data-route="profile" data-i18n="nav.profile" aria-label="Perfil">👤 Perfil</button>
  <button data-route="settings" data-i18n="nav.settings" aria-label="Ajustes">⚙️ Ajustes</button>
</nav>
<script type="module" src="js/app.js"></script>
</body>
</html>
