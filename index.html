<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strumio — Aprende guitarra</title>
<meta name="description" content="Aprende guitarra paso a paso con lecciones, afinador, acordes y práctica diaria. También ukelele y bajo.">
<meta name="theme-color" content="#131f24">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="assets/icons/favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Strumio">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app" id="app">
  <div class="topbar" id="topbar" style="display:none">
    <div class="stat streak"><span>🔥</span><span id="streak">0</span></div>
    <div class="xpbar"><div id="xpfill" style="width:0%"></div></div>
    <div class="stat gem"><span>💎</span><span id="gems">0</span></div>
    <div class="stat heart"><span>❤️</span><span id="hearts">5</span></div>
  </div>
  <div id="view"></div>
</div>
<nav class="bottomnav" id="bottomnav" style="display:none">
  <button data-route="home" class="active">🏠 Inicio</button>
  <button data-route="learn">📚 Aprender</button>
  <button data-route="tuner">🎯 Afinador</button>
  <button data-route="practice">🎸 Practicar</button>
  <button data-route="profile">👤 Perfil</button>
</nav>
<script type="module" src="js/app.js"></script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(()=>{}));
}
</script>
</body>
</html>
